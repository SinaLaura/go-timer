<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd9e7"/>
      <stop offset="1" stop-color="#f29cc3"/>
    </linearGradient>
    <radialGradient id="b" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5a4651"/>
      <stop offset="0.6" stop-color="#1c1418"/>
    </radialGradient>
    <radialGradient id="w" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecdfe4"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#6b1d44" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- A small Go board; the stones sit on its points -->
  <g stroke="#c9608f" stroke-opacity=".45" stroke-width="5">
    <line x1="79" y1="40" x2="79" y2="472"/><line x1="197" y1="40" x2="197" y2="472"/>
    <line x1="315" y1="40" x2="315" y2="472"/><line x1="433" y1="40" x2="433" y2="472"/>
    <line x1="40" y1="79" x2="472" y2="79"/><line x1="40" y1="197" x2="472" y2="197"/>
    <line x1="40" y1="315" x2="472" y2="315"/><line x1="40" y1="433" x2="472" y2="433"/>
  </g>
  <!-- A black and a white stone on the diagonal, a G (Go Girls*) on each -->
  <g filter="url(#sh)" fill="none" stroke-width="14.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="197" cy="197" r="88" fill="url(#b)" stroke="none"/>
    <path d="M227.6 170.4A40.5 40.5 0 1 0 237.5 197L209.2 197" stroke="#f49ac1"/>
    <circle cx="315" cy="315" r="88" fill="url(#w)" stroke="#1c1418" stroke-opacity=".18" stroke-width="3"/>
    <path d="M345.6 288.4A40.5 40.5 0 1 0 355.5 315L327.2 315" stroke="#e8559a"/>
  </g>
</svg>
