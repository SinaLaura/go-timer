<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8cfe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Go timer</title>
<style>
  :root {
    --black-bg: #161616;
    --black-fg: #f4f1ea;
    --white-bg: #f4f1ea;
    --white-fg: #161616;
    --bar: #f8cfe0;
    --bar-fg: #6b1d44;
    --run: #f49ac1;
    --low: #e8559a;
    --out: #d6006f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    height: 100dvh;
    background: var(--bar);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  .half {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vh;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* The top half faces the player across the board. */
  #white { background: var(--white-bg); color: var(--white-fg); transform: rotate(180deg); }
  #black { background: var(--black-bg); color: var(--black-fg); }

  .name {
    display: flex;
    align-items: center;
    gap: .5em;
    font-size: clamp(16px, 3vh, 26px);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .stone { width: 1em; height: 1em; border-radius: 50%; }
  #black .stone { background: radial-gradient(circle at 35% 35%, #666, #000 70%); box-shadow: 0 0 0 1px #777; }
  #white .stone { background: radial-gradient(circle at 35% 35%, #fff, #cfcac0 80%); box-shadow: 0 0 0 1px #999; }

  .time {
    font-size: min(24vw, 15vh);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .hint { font-size: clamp(14px, 2.3vh, 20px); opacity: .75; min-height: 1.3em; }

  .waiting .time { opacity: .35; }
  .running::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 8px solid var(--run);
    pointer-events: none;
  }
  .low .time { color: var(--low); }
  .critical, .flagged { background: var(--out) !important; color: #fff !important; }

  #bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    color: var(--bar-fg);
  }
  button {
    min-height: 48px;
    padding: 0 20px;
    border: 0;
    border-radius: 24px;
    background: #fff;
    color: var(--bar-fg);
    font: inherit;
    font-size: 17px;
    font-weight: 600;
  }
  button:disabled { opacity: .4; }
  /* The time setting doubles as the button that changes it. */
  #info {
    flex: 1;
    padding: 4px 8px;
    background: transparent;
    border: 2px dashed #e08ab0;
    font-size: 15px;
    line-height: 1.25;
  }
  #info:disabled { opacity: 1; border-color: transparent; }
  #info small { display: block; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--low); outline-offset: 2px; }

  dialog {
    margin: auto;
    width: min(360px, calc(100vw - 32px));
    padding: 24px;
    border: 0;
    border-radius: 20px;
    background: #fff5f9;
    color: var(--bar-fg);
  }
  dialog::backdrop { background: rgb(40 10 25 / .6); }
  dialog h2 { font-size: 22px; margin-bottom: 4px; }
  dialog p { font-size: 14px; margin-bottom: 18px; opacity: .8; }
  dialog label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .fields { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 16px; }
  dialog input {
    width: 76px;
    padding: 10px;
    border: 2px solid #f4b6d1;
    border-radius: 12px;
    background: #fff;
    color: inherit;
    font: inherit;
    font-size: 20px;
    text-align: center;
  }
  dialog .preset { width: 100%; margin-bottom: 18px; background: var(--bar); }
  .actions { display: flex; gap: 10px; justify-content: flex-end; }
  .actions .primary { background: var(--out); color: #fff; }
</style>
</head>
<body>

<section class="half" id="white">
  <div class="name"><span class="stone"></span>White</div>
  <div class="time"></div>
  <div class="hint"></div>
</section>

<nav id="bar">
  <button id="pause">Pause</button>
  <button id="info"><small>Fischer</small><span id="setting"></span></button>
  <button id="reset">Reset</button>
</nav>

<section class="half" id="black">
  <div class="name"><span class="stone"></span>Black</div>
  <div class="time"></div>
  <div class="hint"></div>
</section>

<dialog id="settings">
  <form method="dialog">
    <h2>Fischer time</h2>
    <p>A main time, plus a few seconds added after every move.</p>
    <button type="button" class="preset" id="mannheim">Mannheim · 45 min + 15 s</button>
    <label>Main time</label>
    <div class="fields">
      <input id="mainMin" type="number" inputmode="numeric" min="0" max="600"> min
      <input id="mainSec" type="number" inputmode="numeric" min="0" max="59"> s
    </div>
    <label>Added after each move</label>
    <div class="fields">
      <input id="incSec" type="number" inputmode="numeric" min="0" max="600"> s
    </div>
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button value="set" class="primary">Set</button>
    </div>
  </form>
</dialog>

<script>
  // Fischer time; starts on the Mannheim preset, 45 min + 15 s.
  const MANNHEIM = { main: 45 * 60 * 1000, inc: 15 * 1000 };
  let settings = { ...MANNHEIM };
  const LOW = 60 * 1000;      // orange from here
  const CRITICAL = 10 * 1000; // red from here

  const other = p => (p === 'black' ? 'white' : 'black');

  // state: 'ready' | 'running' | 'paused' | 'over'
  let state, active, loser, left, turnStart, wakeLock;

  const ui = {};
  for (const p of ['black', 'white']) {
    const root = document.getElementById(p);
    ui[p] = { root, time: root.querySelector('.time'), hint: root.querySelector('.hint') };
    root.addEventListener('pointerdown', () => tap(p));
  }
  const pauseBtn = document.getElementById('pause');
  const resetBtn = document.getElementById('reset');
  const info = document.getElementById('info');
  const setting = document.getElementById('setting');
  document.addEventListener('contextmenu', e => e.preventDefault());

  function newGame() {
    state = 'ready';
    active = loser = null;
    left = { black: settings.main, white: settings.main };
    releaseWake();
    render();
  }

  // Remaining time, measured from the real clock rather than counted ticks.
  function timeLeft(p) {
    if (state === 'running' && active === p) return left[p] - (performance.now() - turnStart);
    return left[p];
  }

  // Tapping your own half ends your move and starts the other clock.
  function tap(p) {
    if (state === 'ready') return start(other(p));
    if (state !== 'running' || active !== p) return;
    const t = timeLeft(p);
    if (t <= 0) return flag(p);
    left[p] = t + settings.inc;
    start(other(p));
  }

  function start(p) {
    active = p;
    turnStart = performance.now();
    state = 'running';
    keepAwake();
    render();
  }

  function togglePause() {
    if (state === 'running') {
      left[active] = timeLeft(active);
      state = 'paused';
    } else if (state === 'paused') {
      turnStart = performance.now();
      state = 'running';
      keepAwake();
    }
    render();
  }

  function flag(p) {
    left[p] = 0;
    loser = p;
    state = 'over';
    if (navigator.vibrate) navigator.vibrate([400, 150, 400]);
    releaseWake();
    render();
  }

  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', () => {
    if ((state === 'running' || state === 'paused') && !confirm('Reset both clocks?')) return;
    newGame();
  });

  // Changing the time setting, only between games.
  const dialog = document.getElementById('settings');
  const field = id => document.getElementById(id);

  function fillForm(s) {
    field('mainMin').value = Math.floor(s.main / 60000);
    field('mainSec').value = s.main % 60000 / 1000;
    field('incSec').value = s.inc / 1000;
  }
  info.addEventListener('click', () => {
    fillForm(settings);
    dialog.returnValue = '';
    dialog.showModal();
  });
  field('mannheim').addEventListener('click', () => fillForm(MANNHEIM));
  dialog.addEventListener('close', () => {
    if (dialog.returnValue !== 'set') return;
    const num = id => Math.max(0, Math.floor(Number(field(id).value) || 0));
    const main = (num('mainMin') * 60 + num('mainSec')) * 1000;
    if (main <= 0) return;
    settings = { main, inc: num('incSec') * 1000 };
    newGame();
  });

  function describe(s) {
    const m = Math.floor(s.main / 60000), sec = s.main % 60000 / 1000;
    const main = [m && `${m} min`, sec && `${sec} s`].filter(Boolean).join(' ');
    return `${main} + ${s.inc / 1000} s`;
  }

  // Keep the screen on while a game is in progress.
  async function keepAwake() {
    if (wakeLock || !('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* not allowed right now, e.g. tab hidden */ }
  }
  function releaseWake() {
    if (wakeLock) wakeLock.release();
    wakeLock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && (state === 'running' || state === 'paused')) keepAwake();
  });

  function fmt(ms) {
    if (ms < 0) ms = 0;
    if (ms < CRITICAL) return (Math.ceil(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  }

  function setText(el, text) {
    if (el.textContent !== text) el.textContent = text;
  }

  function hintFor(p) {
    if (state === 'ready') return p === 'white' ? "Tap here to start Black's clock" : '';
    if (state === 'paused') return 'Paused';
    if (state === 'over') return p === loser ? 'Lost on time' : 'Wins on time';
    return active === p ? 'Tap after your move' : '';
  }

  function render() {
    const inGame = state === 'running' || state === 'paused';
    for (const p of ['black', 'white']) {
      const t = timeLeft(p), cl = ui[p].root.classList;
      setText(ui[p].time, fmt(t));
      setText(ui[p].hint, hintFor(p));
      cl.toggle('running', state === 'running' && active === p);
      cl.toggle('waiting', inGame && active !== p);
      cl.toggle('low', t < LOW && t >= CRITICAL);
      cl.toggle('critical', inGame && t < CRITICAL);
      cl.toggle('flagged', state === 'over' && loser === p);
    }
    pauseBtn.disabled = !inGame;
    setText(pauseBtn, state === 'paused' ? 'Resume' : 'Pause');
    info.disabled = inGame;
    setText(setting, describe(settings));
  }

  function loop() {
    if (state === 'running') {
      if (timeLeft(active) <= 0) flag(active);
      else render();
    }
    requestAnimationFrame(loop);
  }

  newGame();
  loop();
</script>
</body>
</html>
